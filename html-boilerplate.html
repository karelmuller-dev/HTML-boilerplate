<!DOCTYPE html>
<html class="no-js" lang="cs">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <meta name="text-scale" content="scale">

        <title>{Unique page title} - {My site}</title>

        <link rel="preconnect" href="https://web.site" crossorigin>

        <script>
            // document.documentElement.classList.replace.replace( /(?:^|\s)no-js(?!\S)/ , '' );
            document.documentElement.classList.replace('no-js', 'js');
        </script>

        <link rel="stylesheet" href="/css/styles.css">

        <link rel="preload" href="https://web.site/fonts/*.woff2" as="font" type="font/woff2" crossorigin>
        <meta name="robots" content="index, follow">
        <link rel="canonical" href="https://web.site/page">
        <meta name="format-detection" content="telephone=no"> <#-- disables automatic phone number detection on iOS-->

        <meta name="description" content="{Page description}">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="{Unique page title} - {My site}">
        <meta name="twitter:image" content="https://web.site/img/social-media-logo.png">
        <meta property="og:title" content="{Unique page title} - {My site}">
        <meta property="og:type" content="article">
        <meta property="og:url" content="https://web.site/page">
        <meta property="og:image" content="https://web.site/img/social-media-logo.png">
        <meta property="og:site_name" content="{Website name}">

        <meta name="author" content="Karel Műller, www.jodobry.cz, 2026">

        <link rel="icon" href="https://web.site/favicon.ico" sizes="48x48">
        <link rel="icon" href="https://web.site/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="https://web.site/apple-touch-icon.png">
        <meta name="theme-color" content="#a47864">
    </head>

    <body>
    <!-- Content -->
        <link rel="stylesheet" type="text/css" href="/css/print.css" media="print">
        <script src="/js/script.js"></script>
    </body>
</html>
